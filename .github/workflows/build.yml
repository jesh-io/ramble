name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: Build macOS app + CLI
    runs-on: macos-26
    env:
      # Optional Developer ID signing + notarization. Add these repository
      # secrets and the workflow signs/notarizes automatically:
      #   DEVELOPER_ID_P12  base64 of the "Developer ID Application" .p12
      #   DEVELOPER_ID_P12_PASSWORD
      #   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD (app-specific password)
      DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
      DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then echo "No Xcode 26 on this runner"; ls /Applications | grep Xcode; exit 1; fi
          sudo xcode-select -s "$XCODE"
          swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build app + CLI
        run: ./scripts/build-app.sh

      - name: Sign with Developer ID (if secrets present)
        if: env.DEVELOPER_ID_P12 != ''
        run: |
          KEYCHAIN=$RUNNER_TEMP/build.keychain-db
          echo "$DEVELOPER_ID_P12" | base64 --decode > $RUNNER_TEMP/cert.p12
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          security import $RUNNER_TEMP/cert.p12 -P "$DEVELOPER_ID_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k ci "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
          for fw in dist/Talky.app/Contents/Frameworks/*; do
            [ -e "$fw" ] && codesign --force --options runtime --timestamp --sign "$IDENTITY" "$fw"
          done
          codesign --force --options runtime --timestamp --sign "$IDENTITY" dist/Talky.app
          codesign --force --options runtime --timestamp --sign "$IDENTITY" dist/talky
          codesign --verify --deep --strict dist/Talky.app

      - name: Package
        run: |
          cd dist
          ditto -c -k --keepParent Talky.app Talky-macOS.zip
          ditto -c -k talky talky-cli-macOS.zip
          shasum -a 256 *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Notarize (if secrets present)
        if: env.DEVELOPER_ID_P12 != '' && env.APPLE_ID != ''
        run: |
          xcrun notarytool submit dist/Talky-macOS.zip --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple dist/Talky.app
          cd dist && rm Talky-macOS.zip && ditto -c -k --keepParent Talky.app Talky-macOS.zip && shasum -a 256 *.zip > SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: talky-macos
          path: |
            dist/Talky-macOS.zip
            dist/talky-cli-macOS.zip
            dist/SHA256SUMS.txt

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Talky-macOS.zip
            dist/talky-cli-macOS.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            ## Install
            1. Download **Talky-macOS.zip**, unzip, move `Talky.app` to `/Applications`.
            2. This build is not notarized, so macOS will block the first launch. Either right-click → **Open** → Open, or run:
               ```
               xattr -dr com.apple.quarantine /Applications/Talky.app
               ```
            3. Launch, grant **Microphone** and **Accessibility** when prompted.
            4. For AI cleanup install [Ollama](https://ollama.com) and run `ollama pull qwen3:4b-instruct` (dictation works without it).

            Optional CLI: unzip **talky-cli-macOS.zip** and put `talky` on your PATH.
            Requires macOS 26 on Apple Silicon.
