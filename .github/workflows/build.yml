name: Build

# Builds run only for version tags (and manual dispatch). Cut releases with
# the /release skill, which writes the notes; this workflow just attaches
# the binaries to the release for the tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    permissions:
      contents: write
    name: Build macOS app + CLI
    runs-on: macos-26
    env:
      # Optional Developer ID signing + notarization. Add these repository
      # secrets and the workflow signs/notarizes automatically:
      #   DEVELOPER_ID_P12  base64 of the "Developer ID Application" .p12
      #   DEVELOPER_ID_P12_PASSWORD
      #   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD (app-specific password)
      DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
      DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then echo "No Xcode 26 on this runner"; ls /Applications | grep Xcode; exit 1; fi
          sudo xcode-select -s "$XCODE"
          swift --version

      - name: Cache SwiftPM
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build app + CLI
        env:
          RAMBLE_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          # Release builds ship the trackpad gesture add-on (3-finger triple
          # tap). It uses the private MultitouchSupport framework, so these
          # binaries are for direct download, not App Store submission.
          RAMBLE_ENABLE_GESTURES: "1"
        run: ./scripts/build-app.sh

      - name: Test
        run: |
          swift test
          swift test --package-path Packages/RambleAnalytics

      - name: Sign with Developer ID (if secrets present)
        if: env.DEVELOPER_ID_P12 != ''
        run: |
          KEYCHAIN=$RUNNER_TEMP/build.keychain-db
          echo "$DEVELOPER_ID_P12" | base64 --decode > $RUNNER_TEMP/cert.p12
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          security import $RUNNER_TEMP/cert.p12 -P "$DEVELOPER_ID_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k ci "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
          for fw in dist/Ramble.app/Contents/Frameworks/*; do
            [ -e "$fw" ] && codesign --force --options runtime --timestamp --sign "$IDENTITY" "$fw"
          done
          codesign --force --options runtime --timestamp --sign "$IDENTITY" dist/Ramble.app
          codesign --force --options runtime --timestamp --sign "$IDENTITY" dist/ramble
          cp dist/ramble dist/ramble-cli/ramble
          codesign --verify --deep --strict dist/Ramble.app

      - name: Package
        run: |
          cd dist
          ditto -c -k --keepParent Ramble.app Ramble-macOS.zip
          ditto -c -k --keepParent ramble-cli ramble-cli-macOS.zip
          shasum -a 256 Ramble-macOS.zip ramble-cli-macOS.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Notarize (if secrets present)
        if: env.DEVELOPER_ID_P12 != '' && env.APPLE_ID != ''
        run: |
          xcrun notarytool submit dist/Ramble-macOS.zip --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple dist/Ramble.app
          cd dist && rm Ramble-macOS.zip && ditto -c -k --keepParent Ramble.app Ramble-macOS.zip && shasum -a 256 *.zip > SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ramble-macos
          path: |
            dist/Ramble-macOS.zip
            dist/ramble-cli-macOS.zip
            dist/SHA256SUMS.txt

      - name: Attach binaries to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: true
          files: |
            dist/Ramble-macOS.zip
            dist/ramble-cli-macOS.zip
            dist/SHA256SUMS.txt
