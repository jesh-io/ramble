name: TalkyPhone
options:
  bundleIdPrefix: io.talky
  deploymentTarget:
    iOS: "26.0"
packages:
  Talky:
    path: ..
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    # Pinned: newer tags require swift-tools 6.3 (Xcode > 26.2).
    exactVersion: 3.31.4
  SwiftHuggingFace:
    url: https://github.com/huggingface/swift-huggingface
    from: 0.9.0
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.3.0
targets:
  TalkyPhone:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: Talky
        product: TalkyKit
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: MLXSwiftLM
        product: MLXHuggingFace
      - package: SwiftHuggingFace
        product: HuggingFace
      - package: SwiftTransformers
        product: Tokenizers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.talky.phone
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Talky transcribes your speech on-device.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Talky transcribes speech entirely on-device.
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
